<!-- First Navbar Converted to Bootstrap -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">
        <img src="/logo.png" alt="Logo" style="height: 40px; width: auto; margin-right: 10px;">
        E-Shopping Site
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <!-- User Register Link -->
          <li class="nav-item" *ngIf="!clientLoggedIn && !adminLoggedIn">
            <a class="nav-link" href="register/">User Register</a>
          </li>
          <!-- Login Link -->
          <li class="nav-item" *ngIf="!clientLoggedIn && !adminLoggedIn">
            <a class="nav-link" href="login/">Login</a>
          </li>
          <!-- Admin Login Link -->
          <li class="nav-item" *ngIf="!clientLoggedIn && !adminLoggedIn">
            <a class="nav-link" href="admin/">Admin Login</a>
          </li>
          <!-- Product Link -->
          <li class="nav-item">
            <a class="nav-link" href="product/">Product</a>
          </li>
          <!-- Cart Link -->
          <li class="nav-item" *ngIf="clientLoggedIn">
            <a class="nav-link" href="cart/">Cart</a>
          </li>
          <!-- Order Link -->
          <li class="nav-item" *ngIf="clientLoggedIn">
            <a class="nav-link" href="order/">Order</a>
          </li>
          <!-- Logout Link -->
          <li class="nav-item" *ngIf="clientLoggedIn || adminLoggedIn">
            <a class="nav-link" href="#" (click)="logout()">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
